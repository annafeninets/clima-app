# Для разработки: открывает PostgreSQL и Redis на localhost, чтобы запускать backend через `uv run clima`.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres redis
services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
  redis:
    ports:
      - "127.0.0.1:6379:6379"
