server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Фото вещей уходят base64 в JSON: 5 МБ -> ~6,7 МБ; backend ограничивает запрос 8 МБ.
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Внутренние маршруты (ручной запуск планировщика) наружу не отдаём.
    location /api/internal/ {
        return 404;
    }

    # Тот же origin, что и у frontend: CORS не нужен. Префикс /api/ срезается.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Service worker и runtime-конфиг не должны залипать в кэше браузера.
    location = /service-worker.js {
        add_header Cache-Control "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
    }
    location = /config.js {
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
