name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clima
          POSTGRES_PASSWORD: clima
          POSTGRES_DB: clima_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clima -d clima_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      CLIMA_TEST_DATABASE_URL: postgresql://clima:clima@localhost:5432/clima_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run python -m unittest discover -s tests -v
      - name: Frontend syntax check
        run: |
          for f in $(find frontend/src -name '*.js'); do node --check "$f"; done
          node --check frontend/service-worker.js

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
        env:
          POSTGRES_PASSWORD: ci-only-password
      - run: docker compose build
